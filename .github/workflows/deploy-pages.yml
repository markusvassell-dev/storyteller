# Optional GitHub Pages deployment (fallback host) — MANUAL ONLY.
#
# Cloudflare is the host in use (see docs/deployment.md) and needs no workflow;
# it builds from the repo directly. This runs only when you ask for it, because
# actions/deploy-pages fails with a 404 until GitHub Pages is switched on, and
# a second deploy on every push would publish the app at a second URL nobody
# asked for.
#
# To use it: repo Settings → Pages → Source: GitHub Actions, then run this
# workflow from the Actions tab. Push-triggered checks live in ci.yml.

name: Deploy to GitHub Pages

on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      # Project sites serve from /<repo>/ — the app handles this via BASE_PATH.
      - run: npm run build
        env:
          BASE_PATH: /${{ github.event.repository.name }}/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
