<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1200" role="img">
  <defs>
    <linearGradient id="cloth" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#334a63"/>
      <stop offset="1" stop-color="#26374a"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.42" r="0.7">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.10"/>
      <stop offset="1" stop-color="#000000" stop-opacity="0.18"/>
    </radialGradient>
  </defs>

  <rect width="900" height="1200" fill="url(#cloth)"/>
  <rect width="900" height="1200" fill="url(#glow)"/>

  <!-- spine shading -->
  <rect x="0" y="0" width="46" height="1200" fill="#000" opacity="0.16"/>
  <rect x="46" y="0" width="6" height="1200" fill="#d8bb79" opacity="0.35"/>

  <!-- foil frame -->
  <rect x="96" y="80" width="724" height="1040" fill="none"
        stroke="#d8bb79" stroke-width="4" opacity="0.85"/>
  <rect x="112" y="96" width="692" height="1008" fill="none"
        stroke="#d8bb79" stroke-width="1.5" opacity="0.6"/>

  <!-- corner flourishes -->
  <path d="M96 126 L96 80 L142 80" fill="none" stroke="#d8bb79" stroke-width="6" opacity="0.9"/>
  <path d="M820 126 L820 80 L774 80" fill="none" stroke="#d8bb79" stroke-width="6" opacity="0.9"/>
  <path d="M96 1074 L96 1120 L142 1120" fill="none" stroke="#d8bb79" stroke-width="6" opacity="0.9"/>
  <path d="M820 1074 L820 1120 L774 1120" fill="none" stroke="#d8bb79" stroke-width="6" opacity="0.9"/>

  <!-- title -->
  <text x="450" y="456.96" text-anchor="middle"
        font-family="Georgia, 'Times New Roman', serif" font-size="92" font-weight="700"
        letter-spacing="2" fill="#f1f5fa">FAIRY TALES OF</text>
  <text x="450" y="560" text-anchor="middle"
        font-family="Georgia, 'Times New Roman', serif" font-size="92" font-weight="700"
        letter-spacing="2" fill="#f1f5fa">HANS CHRISTIAN</text>
  <text x="450" y="663.04" text-anchor="middle"
        font-family="Georgia, 'Times New Roman', serif" font-size="92" font-weight="700"
        letter-spacing="2" fill="#f1f5fa">ANDERSEN</text>

  <!-- rule -->
  <path d="M300 772.0799999999999 H600"
        stroke="#d8bb79" stroke-width="3" opacity="0.9"/>
  <circle cx="450" cy="772.0799999999999" r="9" fill="#d8bb79" opacity="0.9"/>

  <!-- author -->
  <text x="450" y="852.0799999999999" text-anchor="middle"
        font-family="Georgia, 'Times New Roman', serif" font-size="40" font-style="italic"
        fill="#f1f5fa" opacity="0.92">Hans Christian Andersen</text>

  

  <text x="450" y="1050" text-anchor="middle"
        font-family="Georgia, 'Times New Roman', serif" font-size="30"
        fill="#d8bb79" opacity="0.95">✦</text>
</svg>
